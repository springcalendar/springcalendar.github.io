<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spring Educational Services — Calendar</title>
<link rel="icon" type="image/png" href="assets/SES_icon.png">
<link rel="stylesheet" href="assets/site.css">
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@fullcalendar/google-calendar@6.1.15/index.global.min.js"></script>
</head>
<body>
<header class="site-header">
  <div class="brand">
    <img class="brand-logo" src="assets/SES_icon.png" alt="Spring Educational Services logo">
    <div class="brand-text">
      <div class="brand-kicker">Spring Educational Services</div>
      <h1>Calendar</h1>
    </div>
  </div>
  <nav class="site-nav">
    <a href="index.html" class="active">Calendar</a>
    <a href="subscribe.html">Subscribe</a>
  </nav>
</header>

<main class="layout">
  <aside class="sidebar">
    <h2>Groups</h2>
    <p class="hint">Toggle groups to show or hide their events.</p>
    <div id="committee-toggles" class="toggles"></div>
  </aside>

  <section class="calendar-wrap">
    <div id="notice" class="notice hidden"></div>
    <div id="calendar"></div>
  </section>
</main>

<!-- Event detail modal -->
<div id="modal" class="modal hidden">
  <div class="modal-card">
    <button class="modal-close" id="modal-close" aria-label="Close">&times;</button>
    <div class="modal-committee" id="modal-committee"></div>
    <h3 id="modal-title"></h3>
    <div class="modal-row" id="modal-when"></div>
    <div class="modal-row" id="modal-where"></div>
    <p class="modal-desc" id="modal-desc"></p>
  </div>
</div>

<script>
const DATA = "data/";
const byKey = {};   // committee key -> {name, color}

async function loadJSON(path) {
  const res = await fetch(path, { cache: "no-store" });
  if (!res.ok) throw new Error("Failed to load " + path);
  return res.json();
}

function fmtWhen(ev) {
  const opts = { weekday: "long", year: "numeric", month: "long", day: "numeric" };
  const start = ev.start;
  if (ev.allDay) return start.toLocaleDateString(undefined, opts) + " · All day";
  const time = { hour: "numeric", minute: "2-digit" };
  let s = start.toLocaleDateString(undefined, opts) + " · " +
          start.toLocaleTimeString(undefined, time);
  if (ev.end) s += " – " + ev.end.toLocaleTimeString(undefined, time);
  return s;
}

function source(c) {
  // A live Google Calendar event source — the browser reads events directly
  // from Google, so the site is always current (no rebuild needed).
  return { id: c.key, googleCalendarId: c.calendar_id, color: c.color };
}

(async function () {
  const [committees, settings] = await Promise.all([
    loadJSON(DATA + "committees.json"),
    loadJSON(DATA + "settings.json").catch(() => ({})),
  ]);
  committees.forEach((c) => { byKey[c.key] = c; });

  const calendarEl = document.getElementById("calendar");
  const togglesEl = document.getElementById("committee-toggles");
  const apiKey = settings.google_api_key || "";

  const calendar = new FullCalendar.Calendar(calendarEl, {
    initialView: "dayGridMonth",
    height: "auto",
    headerToolbar: { left: "prev,next today", center: "title", right: "dayGridMonth,listMonth" },
    dayMaxEvents: 4,
    googleCalendarApiKey: apiKey,
    eventSources: apiKey ? committees.filter((c) => c.calendar_id).map(source) : [],
    eventClick: function (info) {
      info.jsEvent.preventDefault(); // don't open the Google event page
      showModal(info.event);
    },
  });

  // Toggle a committee's live source on/off.
  for (const c of committees) {
    const label = document.createElement("label");
    label.className = "toggle";
    label.innerHTML =
      `<input type="checkbox" ${apiKey && c.calendar_id ? "checked" : ""} ${apiKey && c.calendar_id ? "" : "disabled"}>
       <span class="swatch" style="background:${c.color}"></span>
       <span class="toggle-name">${c.name}</span>`;
    label.querySelector("input").addEventListener("change", (e) => {
      if (e.target.checked) calendar.addEventSource(source(c));
      else { const s = calendar.getEventSourceById(c.key); if (s) s.remove(); }
    });
    togglesEl.appendChild(label);
  }

  if (!apiKey) {
    const n = document.getElementById("notice");
    n.className = "notice";
    n.textContent = "Live calendar not configured yet — add a Google Calendar API key in committees.json (google_api_key), regenerate, and redeploy.";
  }

  calendar.render();
})();

// Modal
const modal = document.getElementById("modal");
function showModal(ev) {
  const committee = byKey[ev.source ? ev.source.id : ""] || {};
  document.getElementById("modal-title").textContent = ev.title;
  document.getElementById("modal-committee").textContent = committee.name || "";
  document.getElementById("modal-committee").style.color = ev.backgroundColor || "#334155";
  document.getElementById("modal-when").textContent = fmtWhen(ev);
  const where = ev.extendedProps.location;
  document.getElementById("modal-where").textContent = where ? "📍 " + where : "";
  document.getElementById("modal-desc").textContent = ev.extendedProps.description || "";
  modal.classList.remove("hidden");
}
document.getElementById("modal-close").onclick = () => modal.classList.add("hidden");
modal.addEventListener("click", (e) => { if (e.target === modal) modal.classList.add("hidden"); });
</script>
</body>
</html>
