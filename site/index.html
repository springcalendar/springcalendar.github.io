<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spring Educational Services — Calendar</title>
<link rel="icon" type="image/png" href="assets/SES_icon.png">
<link rel="stylesheet" href="assets/site.css">
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@fullcalendar/google-calendar@6.1.15/index.global.min.js"></script>
</head>
<body>
<header class="site-header">
  <div class="brand">
    <img class="brand-logo" src="assets/SES_icon.png" alt="Spring Educational Services logo">
    <div class="brand-text">
      <div class="brand-kicker">Spring Educational Services</div>
      <h1>Calendar</h1>
    </div>
  </div>
  <nav class="site-nav">
    <a href="index.html" class="active">Calendar</a>
    <a href="subscribe.html">Subscribe</a>
  </nav>
</header>

<!-- Boys / Girls / General switch -->
<div class="switch-wrap">
  <div class="switch" id="view-switch"></div>
</div>

<main class="layout">
  <aside class="sidebar">
    <h2>Groups</h2>
    <p class="hint">Toggle groups to show or hide their events.</p>
    <div id="committee-toggles" class="toggles"></div>
  </aside>

  <section class="calendar-wrap">
    <div id="notice" class="notice hidden"></div>
    <div id="calendar"></div>
  </section>
</main>

<!-- Event detail modal -->
<div id="modal" class="modal hidden">
  <div class="modal-card">
    <button class="modal-close" id="modal-close" aria-label="Close">&times;</button>
    <div class="modal-committee" id="modal-committee"></div>
    <h3 id="modal-title"></h3>
    <div class="modal-row" id="modal-when"></div>
    <div class="modal-row" id="modal-where"></div>
    <p class="modal-desc" id="modal-desc"></p>
  </div>
</div>

<script>
const DATA = "data/";
const byKey = {};

// Which sections each GROUP view shows. General = everything; Boys/Girls overlay General.
const VIEWS = [
  { id: "general", label: "General", sections: ["general", "boys", "girls"] },
  { id: "boys",    label: "Boys",    sections: ["boys", "general"] },
  { id: "girls",   label: "Girls",   sections: ["girls", "general"] },
];
const DEFAULT_VIEW = "general";

// CALENDAR views (how the events are laid out) — friendly key -> FullCalendar view.
const CAL_VIEWS = {
  month:    "dayGridMonth",
  week:     "timeGridWeek",
  year:     "multiMonthYear",
  upcoming: "listUpcoming",   // custom: rolling agenda, defined in `views` below
};
const DEFAULT_CAL = "month";

let calendar, committees = [], apiKey = "";
let curGroup = DEFAULT_VIEW, curCal = DEFAULT_CAL;

async function loadJSON(path) {
  const res = await fetch(path, { cache: "no-store" });
  if (!res.ok) throw new Error("Failed to load " + path);
  return res.json();
}

function fmtWhen(ev) {
  const opts = { weekday: "long", year: "numeric", month: "long", day: "numeric" };
  const start = ev.start;
  if (ev.allDay) return start.toLocaleDateString(undefined, opts) + " · All day";
  const time = { hour: "numeric", minute: "2-digit" };
  let s = start.toLocaleDateString(undefined, opts) + " · " +
          start.toLocaleTimeString(undefined, time);
  if (ev.end) s += " – " + ev.end.toLocaleTimeString(undefined, time);
  return s;
}

function source(c) {
  return { id: c.key, googleCalendarId: c.calendar_id, color: c.color };
}

function committeesForView(viewId) {
  const view = VIEWS.find((v) => v.id === viewId);
  return committees.filter((c) => view.sections.includes(c.section) && c.calendar_id);
}

/** The group named in ?view=..., or the default if missing/unknown. */
function viewFromUrl() {
  const q = (new URLSearchParams(location.search).get("view") || "").toLowerCase();
  return VIEWS.some((v) => v.id === q) ? q : DEFAULT_VIEW;
}

/** The calendar layout named in ?cal=..., or the default if missing/unknown. */
function calFromUrl() {
  const q = (new URLSearchParams(location.search).get("cal") || "").toLowerCase();
  return CAL_VIEWS[q] ? q : DEFAULT_CAL;
}

/** Keep the address bar in sync so the current group + layout is a shareable link. */
function updateUrl() {
  history.replaceState({}, "", `?view=${curGroup}&cal=${curCal}`);
}

function setView(viewId) {
  curGroup = viewId;
  updateUrl();

  // Highlight the active switch button.
  document.querySelectorAll("#view-switch button").forEach((b) =>
    b.classList.toggle("active", b.dataset.view === viewId));

  // Swap the calendar's live sources to this view's committees.
  calendar.getEventSources().forEach((s) => s.remove());
  const items = committeesForView(viewId);
  if (apiKey) items.forEach((c) => calendar.addEventSource(source(c)));

  // Rebuild the toggle list for this view.
  const togglesEl = document.getElementById("committee-toggles");
  togglesEl.innerHTML = "";
  for (const c of items) {
    const label = document.createElement("label");
    label.className = "toggle";
    label.innerHTML =
      `<input type="checkbox" ${apiKey ? "checked" : "disabled"}>
       <span class="swatch" style="background:${c.color}"></span>
       <span class="toggle-name">${c.name}</span>`;
    label.querySelector("input").addEventListener("change", (e) => {
      if (e.target.checked) calendar.addEventSource(source(c));
      else { const s = calendar.getEventSourceById(c.key); if (s) s.remove(); }
    });
    togglesEl.appendChild(label);
  }
}

(async function () {
  const [committeesData, settings] = await Promise.all([
    loadJSON(DATA + "committees.json"),
    loadJSON(DATA + "settings.json").catch(() => ({})),
  ]);
  committees = committeesData;
  committees.forEach((c) => { byKey[c.key] = c; });
  apiKey = settings.google_api_key || "";

  // Build the switch buttons.
  const switchEl = document.getElementById("view-switch");
  VIEWS.forEach((v) => {
    const b = document.createElement("button");
    b.textContent = v.label;
    b.dataset.view = v.id;
    b.addEventListener("click", () => setView(v.id));
    switchEl.appendChild(b);
  });

  curCal = calFromUrl();

  calendar = new FullCalendar.Calendar(document.getElementById("calendar"), {
    initialView: CAL_VIEWS[curCal],
    height: "auto",
    headerToolbar: {
      left: "prev,next today",
      center: "title",
      right: "dayGridMonth,timeGridWeek,multiMonthYear,listUpcoming",
    },
    buttonText: { today: "Today", month: "Month", week: "Week", year: "Year" },
    views: {
      // A rolling agenda — unlike listMonth this doesn't stop at the month end,
      // so it always answers "what's coming up?".
      listUpcoming: {
        type: "list",
        duration: { days: 60 },
        buttonText: "Upcoming",
        noEventsText: "No events in the next 60 days",
      },
      // Week view: match the sheet's 6 AM–11:30 PM range, open around morning.
      timeGridWeek: {
        slotMinTime: "06:00:00",
        slotMaxTime: "24:00:00",
        scrollTime: "08:00:00",
      },
    },
    dayMaxEvents: 4,
    googleCalendarApiKey: apiKey,
    eventClick: function (info) { info.jsEvent.preventDefault(); showModal(info.event); },
    // Fires whenever the layout changes (or you page prev/next) — keep the URL right.
    datesSet: function (info) {
      const key = Object.keys(CAL_VIEWS).find((k) => CAL_VIEWS[k] === info.view.type);
      if (key && key !== curCal) { curCal = key; }
      updateUrl();
    },
  });

  if (!apiKey) {
    const n = document.getElementById("notice");
    n.className = "notice";
    n.textContent = "Live calendar not configured yet — add a Google Calendar API key in committees.json (google_api_key), regenerate, and redeploy.";
  }

  setView(viewFromUrl()); // ?view=boys / girls / general (defaults to General)
  calendar.render();
})();

// Modal
const modal = document.getElementById("modal");
function showModal(ev) {
  const c = byKey[ev.source ? ev.source.id : ""] || {};
  document.getElementById("modal-title").textContent = ev.title;
  document.getElementById("modal-committee").textContent = c.name || "";
  document.getElementById("modal-committee").style.color = ev.backgroundColor || "#334155";
  document.getElementById("modal-when").textContent = fmtWhen(ev);
  const where = ev.extendedProps.location;
  document.getElementById("modal-where").textContent = where ? "📍 " + where : "";
  document.getElementById("modal-desc").textContent = ev.extendedProps.description || "";
  modal.classList.remove("hidden");
}
document.getElementById("modal-close").onclick = () => modal.classList.add("hidden");
modal.addEventListener("click", (e) => { if (e.target === modal) modal.classList.add("hidden"); });
</script>
</body>
</html>
